<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speak It - Voice Typing</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Sidebar Toggle Button -->
    <button id="sidebarToggle" class="sidebar-toggle" aria-label="Toggle sidebar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 12h18M3 6h18M3 18h18"/>
        </svg>
    </button>

    <!-- Left Sidebar -->
    <aside id="sidebar" class="sidebar">
        <div class="sidebar-header">
            <button id="newSessionBtn" class="new-session-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 5v14M5 12h14"/>
                </svg>
                <span>New Recording</span>
            </button>
        </div>
        <div class="sidebar-content">
            <div id="sessionsList" class="sessions-list">
                <!-- Sessions will be dynamically added here -->
            </div>
        </div>
    </aside>

    <!-- Main Content -->
    <main id="mainContent" class="main-content">
        <!-- Motto Text -->
        <div id="motto" class="motto">You speak, I'll type...</div>

        <!-- Main Box -->
        <div id="mainBox" class="main-box">
            <!-- Central Microphone Button -->
            <button id="centralMicBtn" class="central-mic-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                    <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                    <line x1="12" y1="19" x2="12" y2="23"/>
                    <line x1="8" y1="23" x2="16" y2="23"/>
                </svg>
            </button>

            <!-- Recording Status -->
            <div id="recordingStatus" class="recording-status">Ready to start</div>

            <!-- Microphone Status -->
            <div id="micStatus" class="mic-status">Hear you loud and clear</div>

            <!-- Sound Level Bar -->
            <div class="sound-level-container">
                <div id="soundLevelBar" class="sound-level-bar"></div>
            </div>

            <!-- Transcription Area (hidden initially) -->
            <div id="transcriptionArea" class="transcription-area">
                <div id="transcriptionText" class="transcription-text"></div>
            </div>

            <!-- Bottom Controls -->
            <div class="bottom-controls">
                <!-- Settings Button (Bottom Left) -->
                <button id="settingsBtn" class="settings-btn icon-btn" data-tooltip="Settings">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="3"/>
                        <path d="M12 1v6m0 6v10M1 12h6m6 0h10"/>
                        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z" opacity="0.3"/>
                    </svg>
                </button>

                <!-- Export Button (hidden initially) -->
                <button id="exportBtn" class="export-btn icon-btn" data-tooltip="Export options" style="display: none;">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                        <polyline points="7 10 12 15 17 10"/>
                        <line x1="12" y1="15" x2="12" y2="3"/>
                    </svg>
                </button>

                <!-- Progress Button (Bottom Right) -->
                <button id="progressBtn" class="progress-btn">
                    <svg class="progress-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                        <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                        <path d="M3 9h4M17 9h4M3 12h2M19 12h2M3 15h4M17 15h4" opacity="0.6"/>
                    </svg>
                    <span id="progressBtnText">Start voice typing</span>
                </button>
            </div>
        </div>
    </main>

    <!-- Settings Modal -->
    <div id="settingsModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Settings</h2>
                <button id="closeSettingsBtn" class="close-btn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"/>
                        <line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                <div class="setting-item">
                    <label>
                        <span>Real-time transcription</span>
                        <input type="checkbox" id="realtimeTranscription" checked>
                        <span class="toggle-switch"></span>
                    </label>
                </div>
                <div class="setting-item">
                    <label>
                        <span>Voice detection sensitivity</span>
                    </label>
                    <input type="range" id="vadSensitivity" min="0" max="100" value="50">
                    <div class="range-labels">
                        <span>Low</span>
                        <span>High</span>
                    </div>
                </div>
                <div class="setting-item">
                    <label>
                        <span>Silence timeout (seconds)</span>
                    </label>
                    <input type="range" id="silenceTimeout" min="1" max="10" value="2" step="0.5">
                    <div class="range-value"><span id="silenceTimeoutValue">2.0</span>s</div>
                </div>
                <div class="setting-item">
                    <label for="microphoneSelect">
                        <span>Microphone</span>
                    </label>
                    <select id="microphoneSelect" class="mic-select">
                        <option>Default</option>
                    </select>
                </div>
            </div>
        </div>
    </div>

    <!-- Export Modal -->
    <div id="exportModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Export Options</h2>
                <button id="closeExportBtn" class="close-btn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"/>
                        <line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                <button id="downloadAudioBtn" class="export-option-btn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M9 18V5l12-2v13"/>
                        <circle cx="6" cy="18" r="3"/>
                        <circle cx="18" cy="16" r="3"/>
                    </svg>
                    <span>Download Audio</span>
                </button>
                <button id="downloadTextBtn" class="export-option-btn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                        <polyline points="14 2 14 8 20 8"/>
                        <line x1="16" y1="13" x2="8" y2="13"/>
                        <line x1="16" y1="17" x2="8" y2="17"/>
                        <polyline points="10 9 9 9 8 9"/>
                    </svg>
                    <span>Download Text</span>
                </button>
                <button id="copyTextBtn" class="export-option-btn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
                        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                    </svg>
                    <span>Copy to Clipboard</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Save Session Modal -->
    <div id="saveModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Save Recording</h2>
                <button id="closeSaveBtn" class="close-btn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"/>
                        <line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                <label for="sessionName">Session Name</label>
                <input type="text" id="sessionName" placeholder="Enter session name..." class="session-name-input">
                <div class="modal-actions">
                    <button id="cancelSaveBtn" class="cancel-btn">Cancel</button>
                    <button id="confirmSaveBtn" class="confirm-btn">Save</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Confirm Modal -->
    <div id="confirmModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="confirmTitle">Confirm</h2>
            </div>
            <div class="modal-body">
                <p id="confirmMessage"></p>
                <div class="modal-actions">
                    <button id="cancelConfirmBtn" class="cancel-btn">Cancel</button>
                    <button id="confirmActionBtn" class="confirm-btn">Confirm</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
